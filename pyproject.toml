[project]
name = "ailearns"
version = "0.1.0"
description = "Games and the AIs that learn to play them (A Million Tries)."
readme = "README.md"
license = "MIT"
authors = [{ name = "backstab319", email = "dev.siddhartha.gupta@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0", "torch>=2.5", "pygame-ce>=2.5"]

[project.scripts]
games = "ailearns.games_cli:main"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8"]
jax = ["jax>=0.11.2"]
track = ["wandb>=0.30.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ailearns"]
